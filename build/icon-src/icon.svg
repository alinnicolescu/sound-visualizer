<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sound Visualizer app icon. macOS grid: an 824 pt rounded square on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1140"/>
      <stop offset="0.55" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <radialGradient id="haze" gradientUnits="userSpaceOnUse" cx="512" cy="330" r="520">
      <stop offset="0" stop-color="#7a55ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d4bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="beamC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fe7ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3fe7ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="beamA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb43f" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb43f" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="poolM" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff7be3"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
    <radialGradient id="poolC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8ff3ff"/><stop offset="1" stop-color="#3fe7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="poolA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd18a"/><stop offset="1" stop-color="#ffb43f" stop-opacity="0"/></radialGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e9e4ff"/><stop offset="1" stop-color="#9a8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9a8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
  </defs>

  <rect x="112" y="124" width="800" height="800" rx="180" ry="180" fill="#000" opacity="0.45" filter="url(#shadowBlur)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#haze)"/>

    <!-- Beams fanning out of one moving head -->
    <g filter="url(#glow)" opacity="0.55">
      <polygon points="500,300 524,300 330,760 200,760" fill="#ff4fd8"/>
      <polygon points="496,300 528,300 590,760 434,760" fill="#3fe7ff"/>
      <polygon points="500,300 524,300 824,760 694,760" fill="#ffb43f"/>
    </g>
    <g style="mix-blend-mode:screen">
      <polygon points="500,300 524,300 330,760 200,760" fill="url(#beamM)"/>
      <polygon points="496,300 528,300 590,760 434,760" fill="url(#beamC)"/>
      <polygon points="500,300 524,300 824,760 694,760" fill="url(#beamA)"/>
    </g>
    <!-- Where they land -->
    <ellipse cx="265" cy="762" rx="110" ry="26" fill="url(#poolM)" opacity="0.9"/>
    <ellipse cx="512" cy="764" rx="115" ry="27" fill="url(#poolC)" opacity="0.9"/>
    <ellipse cx="759" cy="762" rx="110" ry="26" fill="url(#poolA)" opacity="0.9"/>

    <!-- Stage edge -->
    <rect x="100" y="790" width="824" height="134" fill="#06060d"/>
    <rect x="160" y="788" width="704" height="6" rx="3" fill="#2b2550"/>

    <!-- Sound: an equalizer along the front of the stage -->
    <g fill="url(#bar)">
      <rect x="292" y="846" width="26" height="30" rx="8"/>
      <rect x="336" y="828" width="26" height="48" rx="8"/>
      <rect x="380" y="812" width="26" height="64" rx="8"/>
      <rect x="424" y="832" width="26" height="44" rx="8"/>
      <rect x="468" y="806" width="26" height="70" rx="8"/>
      <rect x="512" y="820" width="26" height="56" rx="8"/>
      <rect x="556" y="838" width="26" height="38" rx="8"/>
      <rect x="600" y="814" width="26" height="62" rx="8"/>
      <rect x="644" y="834" width="26" height="42" rx="8"/>
      <rect x="688" y="848" width="26" height="28" rx="8"/>
    </g>

    <!-- The moving head: yoke and head, lens glowing -->
    <g>
      <rect x="402" y="196" width="220" height="30" rx="12" fill="#2d2a46"/>
      <path d="M426 222 h34 v74 a18 18 0 0 1 -34 0 z" fill="#3a365c"/>
      <path d="M564 222 h34 v74 a18 18 0 0 1 -34 0 z" fill="#3a365c"/>
      <rect x="452" y="232" width="120" height="86" rx="34" fill="#4a4573"/>
      <ellipse cx="512" cy="306" rx="64" ry="34" fill="url(#lens)" filter="url(#glow)"/>
      <ellipse cx="512" cy="300" rx="34" ry="13" fill="#ffffff"/>
    </g>
  </g>
  <!-- A thin highlight on the tile edge -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" ry="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
</svg>
