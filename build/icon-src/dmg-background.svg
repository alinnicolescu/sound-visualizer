<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17113a"/><stop offset="1" stop-color="#07070f"/></linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="330" cy="40" r="340"><stop offset="0" stop-color="#7a55ff" stop-opacity="0.35"/><stop offset="1" stop-color="#7a55ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glow)"/>
  <text x="330" y="62" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial" font-size="24" font-weight="600" fill="#ffffff">Sound Visualizer</text>
  <text x="330" y="90" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial" font-size="14" fill="#b9b2dd">Drag the app into Applications to install it</text>
  <!-- arrow between the app (x 180) and Applications (x 480) at y 215 -->
  <path d="M262 215 H388" stroke="#8f7dff" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M384 201 L402 215 L384 229" fill="none" stroke="#8f7dff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="360" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial" font-size="11.5" fill="#7d77a3">First launch: allow "Local Network" so lighting data from SoundSwitch can reach the app.</text>
</svg>
